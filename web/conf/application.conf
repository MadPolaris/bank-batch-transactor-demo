# bank-batch-transactor-web — Play 配置
# Demo 级别：journal 用本地 LevelDB（单机），生产换 MongoDB/Cassandra。

play.http.secret.key = "changeme-for-demo-only"

# 关掉 Play 默认的 DB 模块（demo 不用关系型数据库）
play.modules.disabled += "play.api.db.DBModule"
play.modules.disabled += "play.api.db.evolutions.EvolutionsModule"

akka {
  loglevel = INFO

  actor {
    provider = cluster
    serialization-bindings {
      "net.imadz.m25.proto.bank_chain.BankChainStateProto" = proto
    }
  }

  remote.artery {
    canonical.hostname = "127.0.0.1"
    canonical.port = 2551
  }

  cluster {
    seed-nodes = ["akka://application@127.0.0.1:2551"]
    downing-provider-class = "akka.cluster.sbr.SplitBrainResolverProvider"
  }

  persistence {
    journal {
      plugin = "akka.persistence.journal.leveldb"
      leveldb.dir = "target/journal"
    }
    snapshot-store {
      plugin = "akka.persistence.snapshot-store.local"
      local.dir = "target/snapshots"
    }
  }
}

play.server.websocket.periodic-keep-alive-max-idle = 10 seconds
