# Isolated profile: do not load the legacy bootstrap, cluster or serializer bindings.
play.http.secret.key = ${BANK_DURABLE_PLAY_SECRET}
play.filters.hosts.allowed = ["localhost", "127.0.0.1", "[::1]"]
play.filters.csrf.header.protectHeaders = null

play.http.router = "durablebank.Routes"

# Explicitly exclude every application-specific startup module, including the
# legacy name. Keep Play/Guice's built-in enabled modules intact.
play.modules.disabled += "net.imadz.m25.bank.BankRuntimeModule"
play.modules.disabled += "net.imadz.m25.bank.BankModule"
play.modules.disabled += "play.api.db.DBModule"
play.modules.disabled += "play.api.db.evolutions.EvolutionsModule"

bank.durable {
  data-dir = ${MONARCH_DURABLE_BANK_DIR}
  external {
    port = 19091
    port = ${?MONARCH_DURABLE_BANK_EXTERNAL_PORT}
    controls-enabled = false
    controls-enabled = ${?MONARCH_DURABLE_BANK_EXTERNAL_CONTROLS}
  }
}

akka.actor.provider = local
akka.persistence.journal.plugin = "akka.persistence.journal.leveldb"
akka.persistence.journal.leveldb.native = off
akka.persistence.journal.leveldb.dir = ${bank.durable.data-dir}"/journal"
akka.persistence.snapshot-store.plugin = "akka.persistence.snapshot-store.local"
akka.persistence.snapshot-store.local.dir = ${bank.durable.data-dir}"/snapshots"

# Finite observation rounds for manual demonstrations; restart never resets these budgets.
monarch.operation.max-checks = 120
monarch.operation.manual-check-budget = 30
monarch.delivery.max-polls = 300

# The documented sbt run command also sets the development server port/address.
play.server.http.address = "127.0.0.1"
play.server.http.port = 9001
