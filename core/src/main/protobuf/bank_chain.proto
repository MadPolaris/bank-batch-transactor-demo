syntax = "proto3";

package net.imadz.m25;

// Snapshot format for BankChainState[String, String] journaled by monarch-persistence.
// Stable across deploys: field numbers are the compatibility contract.
option java_package = "net.imadz.m25.proto";

message GeneratedFileProto {
  string local_path = 1;
  string file_name = 2;
  int64 byte_size = 3;
  string encoding = 4;
}

message UploadReceiptProto {
  string remote_path = 1;
  int64 bytes_transferred = 2;
  int64 timestamp = 3;
}

message AckResultProto {
  oneof result {
    bool received = 1;
    int64 timeout_ms = 2;
    string rejected_reason = 3;
  }
}

message ResponseFileProto {
  string local_path = 1;
  string file_name = 2;
  int64 byte_size = 3;
  bytes content = 4;
}

message FailureReasonProto {
  string code = 1;
  string message = 2;
  // suggestedAction omitted: not needed for resume
}

message SuspiciousReasonProto {
  string code = 1;
  string message = 2;
}

message ClassificationProto {
  string item = 1;
  oneof kind {
    string success_raw = 2;  // rawResult as string
    FailureReasonProto failure = 3;
    SuspiciousReasonProto suspicious = 4;
  }
}

message BankChainStateProto {
  string batch_id = 1;
  string chain_id = 2;
  repeated string items = 3;
  map<string, string> context = 4;
  GeneratedFileProto generated_file = 5;
  UploadReceiptProto receipt = 6;
  AckResultProto ack = 7;
  ResponseFileProto response_file = 8;
  repeated string raw_results = 9;
  repeated ClassificationProto classifications = 10;
  string last_stage = 11;  // BankStage name, "" when absent
}
