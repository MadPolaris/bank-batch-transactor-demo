kind: slice
aggregate: "Customer Order"
command: park-in-exception-pool
payload:
  {
    "name": "park-in-exception-pool",
    "name_zh": "进入人工异常池",
    "description": "The account update (the real money movement) failed twice — once plus one auto-retry. The order parks in the exception pool: terminal except_pool, visible in the UI, waiting for a human to replay. Settlement did NOT happen.",
