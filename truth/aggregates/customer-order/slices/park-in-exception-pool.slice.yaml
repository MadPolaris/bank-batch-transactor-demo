    "parameters": [
      {
        "name": "chain",
        "dataType": "string",
        "description": "Chain the order belongs to"
      },
      {
        "name": "customerId",
        "dataType": "string",
        "description": "Customer identifier"
      },
      {
        "name": "reason",
        "dataType": "string",
        "description": "Why it parked"
      }
    ],
    "guards": [
      "account update failed twice (initial + one auto-retry)"
    ],
    "produces": [
      "order-parked-in-exception-pool"
    ]
