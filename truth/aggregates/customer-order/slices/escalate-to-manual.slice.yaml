# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: "Customer Order"
command: escalate-to-manual
payload:
  {
    "name": "escalate-to-manual",
    "name_zh": "转人工",
    "description": "A failed item that exhausted its retry budget (retryCount >= maxRetries). Terminal: manual, with a ticket id. A human decides what happens next — the engine stops trying.",
    "description_zh": "用完重试预算的失败项（retryCount >= maxRetries）。终态 manual，带工单号， 后续由人工决定——引擎不再尝试。",
    "parameters": [
      {
        "name": "chain",
        "dataType": "string",
        "description": "Chain the order belongs to"
      },
      {
        "name": "customerId",
        "dataType": "string",
        "description": "Customer identifier"
      },
      {
        "name": "ticketId",
        "dataType": "string",
        "description": "e.g. MAX_RETRY_EXCEEDED-TIMEOUT"
      }
    ],
    "guards": [
      "routing decision is ManualIntervention (policy routing-decision)"
    ],
    "produces": [
      "order-escalated"
    ]
  }
events:
  {
    "order-escalated": {
      "name": "order-escalated",
      "description": "The order left the automatic flow with a manual ticket.",
      "payloads": [
        {
          "name": "chain",
          "dataType": "string",
          "description": "Chain"
        },
        {
          "name": "customerId",
          "dataType": "string",
          "description": "Customer identifier"
        },
        {
          "name": "ticketId",
          "dataType": "string",
          "description": "Manual ticket id"
        }
      ]
    }
  }
