# ═══ truth atom — hand-editable; types: truth/types.yaml ═══
kind: slice
id: abandon-order
name: Abandon Order
name_zh: 放弃订单
description: >
  A failed item the routing policy gives up on (e.g. balance insufficient,
  quota exceeded → Scrap). Terminal: rejected. No retry, no human involved.
description_zh: >
  路由策略决定放弃的失败项（如余额不足、额度超限 → Scrap）。终态 rejected，
  不重试、不转人工。
aggregate: customer-order
parameters:
  - { name: chain, type: string, description: Chain the order belongs to }
  - { name: customerId, type: string, description: Customer identifier }
  - { name: reasonCode, type: string, description: "Failure code, e.g. BALANCE_INSUFFICIENT" }
guards:
  - description: routing decision is Scrap (policy routing-decision)
produces:
  - order-rejected
events:
  order-rejected:
    description: The order was abandoned per policy; terminal.
    payload:
      - { name: chain, type: string, description: Chain }
      - { name: customerId, type: string, description: Customer identifier }
      - { name: reasonCode, type: string, description: Failure code }
