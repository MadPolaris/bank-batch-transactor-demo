# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: "Customer Order"
command: settle-purchase
payload:
  {
    "name": "settle-purchase",
    "name_zh": "申购成交",
    "description": "A successfully classified purchase item settles: the customer's balance is debited and the fund position increased. Idempotent by customerId.",
    "description_zh": "分类成功的申购项成交：客户余额扣减、基金持仓增加。按 customerId 幂等。",
    "parameters": [
      {
        "name": "chain",
        "dataType": "string",
        "description": "\"purchase\""
      },
      {
        "name": "customerId",
        "dataType": "string",
        "description": "Customer identifier"
      },
      {
        "name": "amount",
        "dataType": "number",
        "description": "Purchase amount"
      },
      {
        "name": "fund",
        "dataType": "string",
        "description": "Fund name"
      }
    ],
    "guards": [
      "order not already terminal (first write wins)",
      "account update succeeded (after at most one auto-retry)"
    ],
    "produces": [
      "order-paid"
    ]
  }
events:
  {
    "order-paid": {
      "name": "order-paid",
      "description": "The purchase settled: balance debited, fund position increased.",
      "payloads": [
        {
          "name": "chain",
          "dataType": "string",
          "description": "\"purchase\""
        },
        {
          "name": "customerId",
          "dataType": "string",
          "description": "Customer identifier"
        },
        {
          "name": "amount",
          "dataType": "number",
          "description": "Purchase amount"
        },
        {
          "name": "fund",
          "dataType": "string",
          "description": "Fund name"
        }
      ]
    }
  }
