# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: "Batch Chain Run"
command: start-batch-run
payload:
  {
    "name": "start-batch-run",
    "name_zh": "启动批次运行",
    "description": "Begin executing the six-stage chain for a batch. The initial run state is recorded with the start; a second start for the same batch is rejected, so a batch can never execute twice.",
    "description_zh": "启动一批 items 的六阶段链执行。初始运行状态随启动记下； 同一批的第二次启动会被拒绝，一批永远不会执行两次。",
    "parameters": [
      {
        "name": "runId",
        "dataType": "string",
        "description": "Unique run id; identifies this one run."
      },
      {
        "name": "chainId",
        "dataType": "string",
        "description": "Chain + round + batch index, e.g. \"recharge-r1-b3\"."
      },
      {
        "name": "items",
        "dataType": "string[]",
        "description": "Items encoded \"chain:round:customerId\"."
      }
    ],
    "guards": [
      "runId not already active or finished (duplicate start → rejected)"
    ],
    "produces": [
      "run-started",
      "stage-completed",
      "run-completed",
      "run-failed"
    ]
  }
events:
  {
    "run-started": {
      "name": "run-started",
      "description": "The run began; the initial run state is recorded with it.",
      "payloads": [
        {
          "name": "runId",
          "dataType": "string",
          "description": "Run identifier"
        },
        {
          "name": "chainId",
          "dataType": "string",
          "description": "Chain/round/batch"
        },
        {
          "name": "items",
          "dataType": "string[]",
          "description": "Encoded items"
        }
      ]
    },
    "stage-completed": {
      "name": "stage-completed",
      "description": "One stage finished cleanly. Records which stage (the breakpoint), the stage's output info, and the full run state at that moment — this is the resume point.",
      "payloads": [
        {
          "name": "stage",
          "dataType": "string",
          "description": "Stage name, e.g. upload — the breakpoint"
        },
        {
          "name": "outputInfo",
          "dataType": "map<string",
          "description": "Stage-specific output info"
        }
      ]
    },
    "run-completed": {
      "name": "run-completed",
      "description": "All six stages finished; classifications are final.",
      "payloads": [
        {
          "name": "runId",
          "dataType": "string",
          "description": "Run identifier"
        }
      ]
    },
    "run-failed": {
      "name": "run-failed",
      "description": "A stage failed with a classified error and no recovery rule resolved it.",
      "payloads": [
        {
          "name": "runId",
          "dataType": "string",
          "description": "Run identifier"
        },
        {
          "name": "stage",
          "dataType": "string",
          "description": "Stage where it failed"
        },
        {
          "name": "errorCode",
          "dataType": "string",
          "description": "Classified code, e.g. ACK_TIMEOUT"
        },
        {
          "name": "detail",
          "dataType": "string",
          "description": "Human-readable detail"
        }
      ]
    }
  }
