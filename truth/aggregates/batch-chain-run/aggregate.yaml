# ═══ truth atom — hand-editable; types: truth/types.yaml ═══
kind: aggregate
id: batch-chain-run
name: Batch Chain Run
name_zh: 批次链运行
description: >
  One execution of the six-stage batch chain for a single batch of items.
  This is the unit that gets journaled: every completed stage persists a
  snapshot, so a crash resumes from the breakpoint instead of re-running
  completed stages. One sharded entity per run; a stale run (old generation)
  can never write.
description_zh: >
  一批 items 的六阶段链的一次执行。这是被 journal 的单元：每完成一阶段就
  持久化一个快照，宕机后从断点续跑，已完成的阶段不重做。每个 run 一个分片
  实体；旧世代的 run 永远写不进去。
identity:
  fields: [runId]
  format: "bank-{runId}-{chain}-r{round}-b{index}"
  format_invariant: >
    A4 (arbitrated 2026-10-18): '-' is the delimiter, so chain names and runIds
    must not contain '-' — enforced at creation (BatchKey.encode fails fast).
    Encode and decode are inverse operations in one place (BatchKey); they
    cannot drift.
  description: >
    Entity id == runId. The run token embeds a per-launch runId so journals
    never leak across launches.
  sharding: >
    A2 (arbitrated 2026-10-18): exactly ONE entity type,
    "m25-chain-executor" (ChainExecutionActor.EntityTypeName). The web's
    WebChain is a behavior flavor (adds SimulateCrash) on the same type key
    and journal namespace — never a second type. Same entityId → same journal,
    no divergent state.
state_slots:
  - name: batchId
    type: string
    description: Batch identifier (== runId in the web demo).
  - name: chainId
    type: string
    description: Which chain and round, e.g. "recharge-r1-b3".
  - name: items
    type: string[]
    description: >
      The batch items, encoded "chain:round:customerId" (protobuf needs
      strings; the demo pins [String, String]).
  - name: context
    type: map<string, string>
    description: Free-form run context (batchId, chainId travel with it).
  - name: generatedFile
    type: batch-file.GeneratedFile
    description: Written by file-gen.
    written_by: stage file-gen
  - name: receipt
    type: batch-file.UploadReceipt
    description: Written by upload.
    written_by: stage upload
  - name: ack
    type: ack-result
    description: Written by wait-ack.
    written_by: stage wait-ack
  - name: responseFile
    type: batch-file.ResponseFile
    description: Written by poll.
    written_by: stage poll
  - name: rawResults
    type: string[]
    description: Written by parse.
    written_by: stage parse
  - name: classifications
    type: classification[]
    description: Written by classify; consumed by the business closure.
    written_by: stage classify
  - name: lastStage
    type: stage-id
    description: Which stage completed last (drives metadata derivation).
lifecycle:
  - { from: idle,     via: start-batch-run, to: running }
  - { from: running,  via: run-completed,   to: completed }
  - { from: running,  via: run-failed,      to: failed }
  - { from: running,  via: simulate-crash,  to: recovering }
  - { from: recovering, via: run-recovered, to: running }
invariants:
  - id: run-id-unique
    description: One entity per runId; a second StartRun for an active or finished run is rejected.
  - id: cursor-monotonic
    description: Stages complete in pipeline order; resume skips already-completed stages (cursor-based).
  - id: at-least-once
    description: >
      Recovery is at-least-once — a stage interrupted mid-write may re-run.
      Stage idempotency is the host's responsibility, not the engine's.
persistence:
  mechanism: monarch-persistence PersistentMonarch (EventSourcedBehavior)
  journal_events:
    - RunStarted (carries the initial snapshot)
    - StageDone (cursor, timestamp, metadata, protobuf snapshot)
    - RunCompleted
    - RunFailedEvt
  snapshot: "full state_slots, protobuf-encoded (bank_chain.proto :: BankChainStateProto)"
  cursor: stage-name vocabulary (file-gen … classify); resume replays from the cursor
  generation_guard: RunRegistry per entity — commands from a stale generation die silently
