# ═══ truth atom — hand-editable; types: truth/types.yaml ═══
kind: policy
id: reconfirm-rule
name: Suspicious Reconfirmation
name_zh: 可疑复核
description: >
  Suspicious is never a final state. Each suspicious item is verified against
  the authoritative source; verification decides success or failure. Still
  uncertain after verification → conservatively treated as failure (it then
  goes through routing-decision, never silently dropped).
description_zh: >
  可疑永远不是终态。每个可疑项都要拿权威数据源查证，查证结论定成功或失败；
  查证后仍不确定 → 保守按失败处理（进 routing-decision，绝不静默丢弃）。
triggers:
  - event: run-completed
    note: with suspicious classifications in the run's progress records
invokes:
  - slice: settle-recharge
  - slice: settle-purchase
  - slice: abandon-order
  - slice: escalate-to-manual
  - slice: start-batch-run
rules:
  - when: verified success
    then: settle-recharge / settle-purchase (joins the success settlement flow)
    note: "demo: 60% of suspicious verify as VERIFIED_SUCCESS"
  - when: verified failure
    then: routing-decision (as a fresh failure)
    note: "demo: 40% verify as NETWORK_ERROR with suggestedAction RetrySameArea → auto-rebatch"
  - when: still uncertain after verification
    then: routing-decision as Failure (conservative)
    note: Never stays suspicious — the type system of the flow forbids it.
