# ═══ truth atom — hand-editable; types: truth/types.yaml ═══
kind: policy
id: routing-decision
name: Failure Routing Decision
name_zh: 失败路由决策
description: >
  Every failed item gets exactly one routing decision, from the rebatch-policy
  (ref value-object rebatch-policy). First matching rule wins. RetrySameArea
  items are collected and enqueued as ONE next-round batch — never one batch
  per item (that would deadlock the scheduler).
description_zh: >
  每个失败项有且只有一个路由决策，按 rebatch-policy（见 value-object）
  的规则表，第一条命中生效。判为 RetrySameArea 的项会被收集起来，
  作为**一个**下一轮批次入队——绝不逐项入队（那会卡死调度器）。
triggers:
  - event: run-completed
    note: with failure classifications in the run's progress records
invokes:
  - slice: abandon-order
  - slice: escalate-to-manual
  - slice: start-batch-run
rules:
  - when: retryCount >= maxRetries
    then: escalate-to-manual
    note: Ticket id "MAX_RETRY_EXCEEDED-{code}". retryCount = round - 1.
  - when: failure carries suggestedAction
    then: suggestedAction
    note: The classifier's hint wins over the policy table.
  - when: actionMap contains the failure code
    then: actionMap[code]
    note: "e.g. BALANCE_INSUFFICIENT → Scrap, NETWORK_ERROR → RetrySameArea"
  - when: otherwise
    then: start-batch-run (next round, RetrySameArea with defaultCooldown)
    note: Collected into a single next-round batch after minDelay.
