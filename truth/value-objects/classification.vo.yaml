# ═══ truth atom — hand-editable; types: truth/types.yaml ═══
kind: value-object
id: classification
name: Result Classification
name_zh: 结果三分类
description: >
  Every (raw result × item) pair lands in exactly one of three buckets.
  Success and failure flow straight through; suspicious items must be
  reconfirmed (policy reconfirm-rule) before they get a final state.
description_zh: >
  每个（原始结果 × item）有且仅落入三类之一。成功与失败直接分流；
  可疑项必须经过复核（policy reconfirm-rule）才能定终态。
variants:
  - name: Success
    description: The external system accepted the item.
    fields:
      - { name: item, type: string, description: Item identifier }
      - { name: rawResult, type: string, description: The raw result payload }
  - name: Failure
    description: The external system rejected the item, or verification failed it.
    fields:
      - { name: item, type: string, description: Item identifier }
      - { name: reason, type: failure-reason, description: ref value-object (inline below) }
  - name: Suspicious
    description: Uncertain — needs reconfirmation before a final state.
    fields:
      - { name: item, type: string, description: Item identifier }
      - { name: reason, type: suspicious-reason, description: ref value-object (inline below) }
inline_types:
  - name: failure-reason
    fields:
      - { name: code, type: string, description: "Machine code, e.g. BALANCE_INSUFFICIENT" }
      - { name: message, type: string, description: Human-readable message }
      - { name: suggestedAction, type: next-step, description: "Optional hint from the classifier (ref next-step); NOT journaled in snapshots" }
  - name: suspicious-reason
    fields:
      - { name: code, type: string, description: "Machine code, e.g. TIMEOUT" }
      - { name: message, type: string, description: Human-readable message }
