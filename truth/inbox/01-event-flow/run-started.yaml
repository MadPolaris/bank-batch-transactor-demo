kind: note
type: event
name: RunStarted
name_zh: 批次启动
description: 'A batch run begins: the initial run state (runId, chainId, items) is recorded with the start.
  A second start for the same batch is refused.'
description_zh: 一批运行启动：初始运行状态（runId、chainId、items）随启动记下。同一批的第二次启动会被拒绝。
sequence: 1
payload_fields:
- 'runId: string — 本次运行标识'
- 'chainId: string — 链/轮次/批次，如 recharge-r1-b3'
- 'items: string[] — 编码为 chain:round:customerId 的条目'
