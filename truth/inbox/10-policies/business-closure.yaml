kind: note
type: policy
name: BatchBusinessClosure
name_zh: 批次业务收尾
description: 'When a run completes: (1) suspicious → reconfirm; (2) failures → routing; (3) successes
  settle, double account-update failures park in the exception pool; (4) credited recharge customers chain
  into the purchase chain. Steps in order, idempotent by customerId.'
description_zh: 一批跑完：(1)可疑→复核；(2)失败→路由；(3)成功结算、账务更新两次失败进异常池；(4)已入账充值客户衔接申购链。按序执行，按 customerId 幂等。
triggers:
- run-completed
invokes:
- settle-recharge
- settle-purchase
- abandon-order
- escalate-to-manual
- park-in-exception-pool
- start-batch-run
