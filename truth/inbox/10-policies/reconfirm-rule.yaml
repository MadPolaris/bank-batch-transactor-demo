kind: note
type: policy
name: SuspiciousReconfirmation
name_zh: 可疑复核
description: 'Suspicious is never final: verify each suspicious item against the authoritative source.
  Verified success joins settlement; verified failure (or still-uncertain, conservatively) joins routing.
  Demo: 60% verify success, 40% NETWORK_ERROR → auto-rebatch.'
description_zh: 可疑永远不是终态：拿权威数据源逐项查证。查证成功进结算；查证失败（或仍不确定，保守按失败）进路由。演示：60% 查证成功，40% 为 NETWORK_ERROR→自动重批。
triggers:
- run-completed (with suspicious)
