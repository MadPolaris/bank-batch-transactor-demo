kind: note
type: command
name: ReplayException
name_zh: 人工重放
description: 'A human replays a parked order: the pool entry is removed, the account update is retried
  without fault injection, and on success the ledger transitions except_pool → credited/paid together
  with the money.'
description_zh: 人工重放异常池订单：移除池条目，不注入故障重试账务更新；成功则账本随资金一起从 except_pool 变为 credited/paid。
triggers:
- 'role: 运营人员（一键重放）'
produces:
- exception-replayed
parameters:
- 'chain: string'
- 'customerId: string'
guards:
- 订单当前在异常池
- 人工已确认
