# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: read-model
name: "Exception Pool"
payload:
  {
    "id": "exception-pool",
    "name": "Exception Pool",
    "name_zh": "人工异常池",
    "description": "Orders whose account update failed twice, waiting for human replay. Queryable in the UI; replay is one click (single or all). Replay moves the money without fault injection, and a successful replay is a legal terminal transition: the ledger moves except_pool → credited/paid (see slice replay-exception).",
    "description_zh": "账务更新失败两次、等待人工重放的订单。UI 可查，一键重放（单个或全部）。 重放时资金确实会动且不再注入故障；重放成功是一次合法的终态迁移， 账本从 except_pool 变为 credited/paid（见 slice replay-exception）。",
    "served_by": [
      "GET /api/bank-batch/exceptions",
      "POST /api/bank-batch/exceptions/replay",
      "POST /api/bank-batch/exceptions/:chain/:customerId/replay"
    ],
    "sources": [
      "Customer Order"
    ],
    "sourceAggregate": "Customer Order",
    "visible_to": [],
    "fields": [
      {
        "name": "count",
        "dataType": "integer",
        "description": "pool size",
        "source": "aggregateIdentity"
      },
      {
        "name": "entries[].chain",
        "dataType": "string",
        "description": "chain of the parked order",
        "source": "eventField:order-parked-in-exception-pool.chain"
      },
      {
        "name": "entries[].customerId",
        "dataType": "string",
        "description": "customer of the parked order",
        "source": "eventField:order-parked-in-exception-pool.customerId"
      },
      {
        "name": "entries[].name",
        "dataType": "string",
        "description": "display name",
        "source": "eventField:order-parked-in-exception-pool.customerId"
      },
      {
        "name": "entries[].amount",
        "dataType": "number",
        "description": "order amount",
        "source": "eventField:order-credited.amount"
      },
      {
        "name": "entries[].reason",
        "dataType": "string",
        "description": "park reason, e.g. 账务更新两次失败",
        "source": "eventField:order-parked-in-exception-pool.reason"
      },
      {
        "name": "entries[].at",
        "dataType": "instant",
        "description": "park time",
        "source": "eventField:order-parked-in-exception-pool.customerId"
      }
    ]
  }
